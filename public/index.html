<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunty - SuntyAI 1.0 par SuntyraXx</title>
  <meta name="description" content="SuntyAI 1.0 - Interface IA Intelligente & Multimodale créée et développée par SuntyraXx.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Markdown Parser (marked) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Highlight.js pour la coloration syntaxique du code -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- DOMPurify pour la désinfection XSS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>

  <!-- Feuille de style personnalisée Aurora & Glassmorphism -->
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="h-full bg-[#05070e] text-slate-100 antialiased selection:bg-cyan-500 selection:text-white flex overflow-hidden">

  <!-- SVG Définition du Logo Sunty Officiel Gradient -->
  <svg class="hidden">
    <defs>
      <linearGradient id="suntyLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00F0FF" />
        <stop offset="22%" stop-color="#0072FF" />
        <stop offset="55%" stop-color="#9333EA" />
        <stop offset="78%" stop-color="#EC4899" />
        <stop offset="100%" stop-color="#F97316" />
      </linearGradient>
    </defs>
  </svg>

  <!-- ================= 1. SIDEBAR GAUCHE (SOMBRE & NÉON) ================= -->
  <aside class="w-72 bg-aurora-sidebar flex flex-col justify-between z-20 relative shrink-0">
    
    <!-- Ligne de séparation néon lumineuse entre sidebar et main -->
    <div class="sidebar-glow-divider"></div>

    <div class="p-4 relative z-10 flex flex-col h-full overflow-hidden">
      
      <!-- Top Logo Sunty & Bouton Nouveau Chat Icon -->
      <div class="flex items-center justify-between mb-4 px-1">
        <div class="flex items-center gap-3 cursor-pointer group" onclick="startNewChat(false)">
          <!-- SVG Logo Sunty 'S' Ribbon 3D -->
          <div class="w-9 h-9 flex items-center justify-center shrink-0 sunty-logo-glow">
            <svg viewBox="0 0 100 100" class="w-full h-full" fill="none">
              <path d="M 72 26 C 72 14, 44 12, 30 24 C 12 38, 18 58, 44 58 C 74 58, 84 76, 68 90 C 50 104, 22 92, 22 78" 
                    stroke="url(#suntyLogoGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="flex flex-col">
            <span class="text-2xl font-black tracking-tight text-white drop-shadow-md group-hover:text-cyan-300 transition">Sunty</span>
          </div>
        </div>

        <!-- Bouton Nouveau Chat Icon (en haut à droite) -->
        <button onclick="startNewChat()" title="Nouvelle discussion" class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-white/10 transition active:scale-95">
          <i data-lucide="square-pen" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Bouton Barre Nouveau Chat -->
      <button onclick="startNewChat()" class="w-full flex items-center justify-between px-4 py-2.5 rounded-full bg-[#0a1124] border border-cyan-500/30 hover:border-cyan-400 text-slate-200 hover:text-white text-xs font-semibold shadow-[0_0_20px_rgba(0,240,255,0.15)] mb-5 transition duration-200 group active:scale-98">
        <div class="flex items-center gap-2.5">
          <i data-lucide="search" class="w-4 h-4 text-cyan-400 group-hover:rotate-12 transition"></i>
          <span>Nouveau chat</span>
        </div>
        <i data-lucide="plus" class="w-4 h-4 text-cyan-400"></i>
      </button>

      <!-- Navigation Principale -->
      <nav id="sidebar-nav" class="space-y-1 mb-4 text-slate-400 text-xs font-medium">
        <a href="#" onclick="switchTab(event, 'accueil')" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl bg-white/10 text-white font-semibold relative transition border border-cyan-400/30 shadow-[0_0_15px_rgba(0,240,255,0.15)]" data-tab="accueil">
          <span class="w-1.5 h-4 bg-cyan-400 rounded-full absolute left-0 shadow-[0_0_8px_#22d3ee]"></span>
          <i data-lucide="home" class="w-4 h-4 text-cyan-400"></i>
          <span>Accueil</span>
        </a>
        <a href="#" onclick="switchTab(event, 'decouvrir')" class="nav-item flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-white/5 hover:text-white transition" data-tab="decouvrir">
          <i data-lucide="compass" class="w-4 h-4 text-slate-400"></i>
          <span>Découvrir</span>
        </a>
        <a href="#" onclick="switchTab(event, 'images')" class="nav-item flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-white/5 hover:text-white transition" data-tab="images">
          <i data-lucide="image" class="w-4 h-4 text-slate-400"></i>
          <span>Images</span>
        </a>
        <a href="#" onclick="switchTab(event, 'fichiers')" class="nav-item flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-white/5 hover:text-white transition" data-tab="fichiers">
          <i data-lucide="folder" class="w-4 h-4 text-slate-400"></i>
          <span>Fichiers</span>
        </a>
        <a href="#" onclick="switchTab(event, 'live')" class="nav-item flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-white/5 hover:text-white transition" data-tab="live">
          <i data-lucide="radio" class="w-4 h-4 text-slate-400"></i>
          <span>Sunty Live</span>
        </a>
      </nav>

      <!-- Section Discussions Récentes -->
      <div class="flex-1 overflow-y-auto pr-1 space-y-1 mb-2">
        <div class="flex items-center justify-between px-3 mb-2">
          <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Récents</span>
          <span id="recent-chats-count" class="px-2 py-0.5 rounded-full bg-cyan-500/20 border border-cyan-400/30 text-[10px] text-cyan-300 font-bold">0</span>
        </div>

        <div id="recent-chats-list" class="space-y-1">
          <!-- Injecté dynamiquement par app.js -->
        </div>
      </div>

      <!-- Bas de Sidebar : Profil Utilisateur -->
      <div class="pt-3 mt-auto border-t border-white/5">
        <div class="w-full p-2 rounded-2xl bg-white/[0.04] hover:bg-white/[0.08] flex items-center justify-between transition cursor-pointer group">
          <div class="flex items-center gap-2.5 truncate">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-400 via-blue-500 to-fuchsia-500 p-0.5 shrink-0 shadow-md">
              <div class="w-full h-full bg-slate-950 rounded-full flex items-center justify-center text-white text-xs font-bold">
                J
              </div>
            </div>
            <div class="flex flex-col truncate">
              <div class="flex items-center gap-1">
                <span class="text-xs font-bold text-white group-hover:text-cyan-300 transition">Jblée</span>
                <i data-lucide="chevron-down" class="w-3 h-3 text-slate-400"></i>
              </div>
              <span class="text-[10px] text-slate-400 leading-tight">SuntyAI 1.0</span>
            </div>
          </div>
          <button onclick="showToast('Paramètres de l\'application')" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition">
            <i data-lucide="settings" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

    </div>
  </aside>


  <!-- ================= 2. ZONE CENTRALE (CANVAS AURORA) ================= -->
  <main class="flex-1 bg-aurora-canvas flex flex-col h-full relative overflow-hidden z-10">

    <!-- Orbes Lumineux Animés (Aurora Glows) -->
    <div class="aurora-orb-1"></div>
    <div class="aurora-orb-2"></div>
    <div class="aurora-orb-3"></div>

    <!-- En-tête Supérieur Droit -->
    <header class="h-16 px-6 md:px-8 flex items-center justify-end gap-3 z-20 shrink-0">
      
      <!-- Mini logo Sunty en haut -->
      <div class="w-7 h-7 flex items-center justify-center mr-auto">
        <svg viewBox="0 0 100 100" class="w-full h-full" fill="none">
          <path d="M 72 26 C 72 14, 44 12, 30 24 C 12 38, 18 58, 44 58 C 74 58, 84 76, 68 90 C 50 104, 22 92, 22 78" 
                stroke="url(#suntyLogoGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- Bouton Grille d'outils -->
      <button onclick="showToast('Outils Sunty')" title="Outils" class="p-2 rounded-full hover:bg-white/10 text-slate-300 hover:text-white transition">
        <i data-lucide="grid" class="w-4 h-4"></i>
      </button>

      <!-- Bouton Bascule Thème Sombre / Clair -->
      <button onclick="toggleTheme()" title="Basculer thème Clair/Sombre" class="p-2 rounded-full bg-white/10 hover:bg-white/20 border border-white/10 text-slate-200 hover:text-white transition backdrop-blur-md shadow-sm active:scale-95">
        <i id="theme-toggle-icon" data-lucide="sun" class="w-4 h-4"></i>
      </button>

      <!-- Badge Modèle Actif SuntyAI 1.0 -->
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-400/30 text-cyan-300 text-xs font-bold backdrop-blur-md shadow-[0_0_15px_rgba(0,240,255,0.15)]">
        <span class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399] animate-pulse"></span>
        <span>SuntyAI 1.0</span>
      </div>

      <!-- Avatar Utilisateur avec anneau lumineux -->
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-400 via-blue-500 to-fuchsia-600 p-0.5 ml-1 shadow-lg shadow-cyan-500/20">
        <div class="w-full h-full bg-slate-950 rounded-full flex items-center justify-center text-white font-bold text-xs">
          J
        </div>
      </div>
    </header>


    <!-- Zone de Discussion Défilante -->
    <div id="chat-container" class="flex-1 overflow-y-auto px-4 md:px-12 lg:px-16 py-4 space-y-6 max-w-4xl mx-auto w-full z-20">
      
      <!-- Vue dynamique des messages ou écran de bienvenue -->
      <div id="main-content-view" class="fade-in-up space-y-6">
        <!-- Rempli dynamiquement par app.js -->
      </div>

    </div>


    <!-- Barre de Saisie Flottante & Filtres d'actions -->
    <div class="p-4 md:p-6 pt-2 max-w-3xl mx-auto w-full z-20 space-y-3">
      
      <!-- Prévisualisation des pièces jointes au-dessus de l'input -->
      <div id="file-preview-container" class="hidden flex flex-wrap gap-2 px-2"></div>

      <!-- Formulaire d'envoi principal -->
      <form onsubmit="handleChatSubmit(event)" class="chat-input-bar px-4 py-2.5 flex items-center gap-3 group">
        
        <!-- Input file caché pour les pièces jointes (multimodal) -->
        <input type="file" id="file-input" class="hidden" accept="image/png,image/jpeg,image/webp,application/pdf,text/plain">

        <!-- Bouton Pièce Jointe (+) -->
        <button type="button" onclick="triggerFileUpload()" title="Joindre une image ou un document" class="w-8 h-8 rounded-full bg-white/10 hover:bg-cyan-500/20 text-slate-300 hover:text-cyan-300 flex items-center justify-center transition shrink-0 active:scale-95">
          <i data-lucide="plus" class="w-5 h-5"></i>
        </button>
        
        <!-- Champ de texte -->
        <input id="chat-input" type="text" autocomplete="off" placeholder="Demander à Sunty..." class="bg-transparent border-none outline-none text-sm text-white placeholder-slate-400 flex-1 px-1">
        
        <div class="flex items-center gap-2 shrink-0">
          <!-- Bouton Dictée vocale -->
          <button type="button" onclick="showToast('Saisie vocale activée (simulation)')" title="Dictée vocale" class="p-2 text-slate-400 hover:text-white transition rounded-full">
            <i data-lucide="mic" class="w-4 h-4"></i>
          </button>
          
          <!-- Bouton Envoyer -->
          <button id="chat-submit-btn" type="submit" title="Envoyer le message" class="w-9 h-9 rounded-full bg-gradient-to-tr from-cyan-400 via-blue-500 to-fuchsia-500 text-white flex items-center justify-center hover:opacity-95 transition shadow-lg shadow-cyan-500/30 active:scale-95">
            <i data-lucide="send-horizontal" class="w-4 h-4 ml-0.5"></i>
          </button>
        </div>
      </form>

      <!-- Pastilles d'actions rapides sous l'input (Fidèle à la maquette) -->
      <div class="flex items-center justify-center gap-2 flex-wrap">
        <button onclick="insertPromptAction('Recherche des informations sur ')" class="action-pill">
          <i data-lucide="search" class="w-3.5 h-3.5 text-cyan-400"></i>
          <span>Rechercher</span>
        </button>
        <button onclick="insertPromptAction('Génère une image artistique de ')" class="action-pill">
          <i data-lucide="image" class="w-3.5 h-3.5 text-emerald-400"></i>
          <span>Créer une image</span>
        </button>
        <button onclick="insertPromptAction('Résume ce document ou texte : ')" class="action-pill">
          <i data-lucide="file-text" class="w-3.5 h-3.5 text-amber-400"></i>
          <span>Résumer</span>
        </button>
        <button onclick="insertPromptAction('Génère un script optimisé pour ')" class="action-pill">
          <i data-lucide="code-2" class="w-3.5 h-3.5 text-rose-400"></i>
          <span>Code</span>
        </button>
        <button onclick="insertPromptAction('Aide-moi à structurer mon projet ')" class="action-pill">
          <i data-lucide="more-horizontal" class="w-3.5 h-3.5 text-indigo-400"></i>
          <span>Plus</span>
        </button>
      </div>

    </div>

  </main>


  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 border border-cyan-400 text-white px-4 py-3 rounded-2xl shadow-2xl z-50 transform translate-y-20 opacity-0 transition duration-300 flex items-center gap-2 text-xs font-bold">
    <i data-lucide="info" class="w-4 h-4 text-cyan-400"></i>
    <span id="toast-msg">Notification</span>
  </div>


  <!-- Script Frontend Principal -->
  <script src="/js/app.js"></script>

</body>
</html>
